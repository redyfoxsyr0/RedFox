<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>REDFOX | ANTI-CHEAT ARCHITECT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        :root {
            --bg: #0a0a0f;
            --accent: #ff00aa;
            --accent2: #00f0ff;
            --accent3: #cc00ff;
            --neon-green: #39ff14;
            --yellow: #ffd700;
            --text: #f0f0ff;
            --muted: #a0a0cc;
            --card: rgba(15, 10, 35, 0.92);
            --border: rgba(0, 240, 255, 0.15);
            --radius-lg: 24px;
            --radius-md: 16px;
            --blur: 28px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        body {
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 170, 0.18), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 240, 255, 0.18), transparent 50%),
                #0a0a0f;
        }

        /* Enhanced Background Layers */
        #particles { position: fixed; inset: 0; z-index: -4; }
        .grid-bg {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
            background-size: 52px 52px;
            z-index: -3;
            opacity: 0.85;
        }
        .scanlines {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 2px,
                rgba(0, 240, 255, 0.035) 2px,
                rgba(0, 240, 255, 0.035) 4px
            );
            pointer-events: none;
            z-index: -2;
            animation: scan 6s linear infinite;
        }
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, rgba(10,10,15,0.9) 90%);
            z-index: -1;
            pointer-events: none;
        }

        .app-shell {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px clamp(20px, 6vw, 52px);
            gap: 20px;
            position: relative;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 
                0 0 30px var(--accent),
                0 0 60px rgba(0, 240, 255, 0.4);
            border: 2px solid rgba(0, 240, 255, 0.3);
            transition: 0.3s ease;
        }

        .brand:hover .brand-logo {
            transform: rotate(8deg) scale(1.08);
        }

        .brand-name {
            font-weight: 900;
            font-size: 1.45rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--accent);
        }

        .brand-tagline {
            font-size: 0.82rem;
            color: var(--accent2);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            font-weight: 600;
        }

        nav {
            display: flex;
            gap: 6px;
            padding: 8px;
            border-radius: 999px;
            background: rgba(20, 15, 45, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(24px);
        }

        .nav-pill {
            padding: 12px 26px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-pill.active,
        .nav-pill:hover {
            color: white;
            background: rgba(255, 0, 170, 0.2);
            box-shadow: 0 0 25px var(--accent);
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-shell {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .tab-view {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.94) translateY(20px);
            filter: blur(4px);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .tab-view.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) translateY(0);
            filter: blur(0);
        }

        /* Hero */
        .hero-title {
            font-size: clamp(3.4rem, 8vw, 6.2rem);
            font-weight: 950;
            line-height: 0.95;
            letter-spacing: -0.04em;
            text-shadow: 
                0 0 20px var(--accent),
                0 0 40px var(--accent2);
        }

        .glitch {
            position: relative;
            display: inline-block;
            animation: glitch-skew 4s infinite linear alternate-reverse;
        }

        @keyframes glitch-skew {
            0%, 100% { transform: skew(0deg); }
            10% { transform: skew(8deg); }
            20% { transform: skew(-6deg); }
        }

        /* Cards */
        .card {
            background: linear-gradient(145deg, rgba(20, 15, 45, 0.95), rgba(10, 8, 25, 0.95));
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: 
                0 0 40px rgba(0, 240, 255, 0.15),
                inset 0 0 40px rgba(255, 0, 170, 0.08);
            backdrop-filter: blur(var(--blur));
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent, rgba(0, 240, 255, 0.03), transparent);
            pointer-events: none;
        }

        .card:hover {
            border-color: var(--accent2);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.35);
            transform: translateY(-6px);
        }

        /* Buttons */
        .btn {
            padding: 14px 28px;
            border-radius: 999px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(110deg, var(--accent), #ff00ff, var(--accent2));
            border: none;
            box-shadow: 0 0 35px var(--accent);
        }

        .btn-primary:hover {
            box-shadow: 0 0 50px var(--accent), 0 0 70px var(--accent2);
            transform: translateY(-4px) scale(1.03);
        }

        /* Status Effects */
        .status-dot {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0.8); }
            70% { box-shadow: 0 0 0 12px rgba(57, 255, 20, 0); }
        }

        /* Footer */
        footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--muted);
            text-shadow: 0 0 10px var(--accent2);
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="grid-bg"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="app-shell">
        <header>
            <div class="brand">
                <div class="brand-logo">
                    <img src="https://raw.githubusercontent.com/redyfoxsyr0/RedFox/main/Copilot_20260405_070339.png" alt="RedFox Logo">
                </div>
                <div>
                    <div class="brand-name glitch" data-text="REDFOX">REDFOX</div>
                    <div class="brand-tagline">ANTI-CHEAT ARCHITECT v2.4</div>
                </div>
            </div>
            <nav>
                <button class="nav-pill active" data-tab="home">HOME</button>
                <button class="nav-pill" data-tab="about">PHILOSOPHY</button>
                <button class="nav-pill" data-tab="anticheat">DETECTIONS</button>
                <button class="nav-pill" data-tab="links">CONNECT</button>
            </nav>
        </header>

        <!-- Rest of your content remains mostly the same, but with enhanced styling -->
        <!-- (I kept the structure identical for easy replacement) -->

        <main class="main-shell">
            <section class="tab-view active" data-tab-view="home">
                <div class="hero-grid" style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(340px,0.9fr);gap:48px;height:100%;align-items:center;">
                    <div class="hero">
                        <h1 class="hero-title neon-text glitch" data-text="REDFOX">REDFOX</h1>
                        <p style="font-size:1.8rem;color:var(--accent2);margin:8px 0 20px;">ANTI-CHEAT ARCHITECT</p>
                        <p style="font-size:1.1rem;color:var(--muted);max-width:680px;line-height:1.7;">
                            Next-generation security framework. Movement forensics. Physics validation. 
                            Workspace integrity. Zero-tolerance enforcement.
                        </p>
                        <div style="margin-top:32px;display:flex;gap:16px;flex-wrap:wrap;">
                            <a class="btn btn-primary" href="https://www.roblox.com/games/88518127505129/RedFox-Anti-Cheat" target="_blank">
                                <i class="fas fa-shield-halved"></i> DEPLOY ANTI-CHEAT
                            </a>
                            <button class="btn" data-tab-trigger="about" style="border:1px solid var(--accent2);color:var(--accent2);">
                                <i class="fas fa-terminal"></i> ACCESS CORE PHILOSOPHY
                            </button>
                        </div>
                    </div>

                    <!-- Engine Card (Enhanced) -->
                    <div class="card engine-card">
                        <!-- Your existing engine card content can go here -->
                    </div>
                </div>
            </section>

            <!-- Other tabs remain the same but inherit the new cyberpunk styling -->
            <!-- You can copy the rest of your sections from the original code -->
        </main>

        <footer>
            © <span id="year"></span> REDFOX • NEURAL DEFENSE SYSTEMS
        </footer>
    </div>

    <script>
        // Same particle + tab script as before (kept for functionality)
        function switchTab(tab) {
            document.querySelectorAll(".nav-pill").forEach(pill => pill.classList.toggle("active", pill.dataset.tab === tab));
            document.querySelectorAll(".tab-view").forEach(view => view.classList.toggle("active", view.dataset.tabView === tab));
        }

        document.querySelectorAll(".nav-pill").forEach(pill => {
            pill.addEventListener("click", () => switchTab(pill.dataset.tab));
        });

        document.querySelectorAll("[data-tab-trigger]").forEach(btn => {
            btn.addEventListener("click", () => switchTab(btn.dataset.tabTrigger));
        });

        document.getElementById("year").textContent = new Date().getFullYear();

        // Particle system (same as before, but more intense)
        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.6;
                this.vy = (Math.random() - 0.5) * 0.6;
                this.size = Math.random() * 2.2 + 0.6;
                this.alpha = Math.random() * 0.6 + 0.25;
                this.hue = Math.random() > 0.5 ? 300 : 180;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = `hsl(${this.hue}, 100%, 85%)`;
                ctx.shadowBlur = 18;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 70%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            const count = window.innerWidth < 800 ? 70 : 130;
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }
        initParticles();
        window.addEventListener("resize", initParticles);

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
